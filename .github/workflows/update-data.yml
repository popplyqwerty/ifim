name: Refresh monitor data

on:
  schedule:
    - cron: "0 3 5,20 * *"     # 03:00 UTC on the 5th and 20th of every month
  workflow_dispatch:           # or run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pdfplumber
      - run: python update_data.py --max-pages 8
      - name: Commit if data.json changed
        run: |
          git config user.name  "ifim-bot"
          git config user.email "ifim-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "data: refresh $(date -u +%F)"
          git push
